name: Release

# Push a tag like v0.1.1 and this builds vi-rpc.exe and attaches it to a GitHub release of that tag.
# Running copies of the tool find it there (auto-update checks releases/latest for `vi-rpc.exe`).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches Cargo.toml
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ($tag -ne $cargo) { Write-Error "tag $tag but Cargo.toml says $cargo"; exit 1 }

      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --locked

      - name: Test
        run: cargo test --release --locked

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          name: GTA VI RPC ${{ github.ref_name }}
          generate_release_notes: true
          files: target/release/vi-rpc.exe
