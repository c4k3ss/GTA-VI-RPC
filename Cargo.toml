[package]
name = "vi-rpc"
version = "0.1.0"
edition = "2024"

[dependencies]
discord-rich-presence = "0.2"
memchr = "2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Diagnostics_Debug", "Win32_System_Memory", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
