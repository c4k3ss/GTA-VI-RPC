[package]
name = "vi-rpc"
version = "0.1.3"
edition = "2024"

[dependencies]
discord-rich-presence = "0.2"
memchr = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
tray-icon = "0.19"
ureq = { version = "2", features = ["json"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Diagnostics_Debug", "Win32_System_Memory", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_Security", "Win32_System_Console", "Win32_System_Registry", "Win32_UI_Shell"] }

[build-dependencies]
winresource = "0.1"
