# Optional: copy to vi-rpc.toml next to vi-rpc.exe. Every key is optional; leave out what you do not change.
# Your own Discord application instead of the project's (its name and art are what Discord shows).
app_id = "<your Discord application id>"
# Seconds between presence updates (Discord allows one per 15 s).
interval = 15
# Fetch and install newer releases from GitHub (on start and every six hours; the tray menu checks on demand).
auto_update = true
# Start with the console hidden; the tray menu shows it. `vi-rpc.exe --console` overrides for one run.
hide_console = true
