# Optional: copy to vi-rpc.toml next to vi-rpc.exe to use your own Discord application instead of the project's.
app_id = "<your Discord application id>"
# Seconds between presence updates (Discord allows one per 15 s).
interval = 15
# Fetch and install newer releases from GitHub (on start and every six hours).
auto_update = true
# Start with the console hidden; the tray menu shows it. `vi-rpc.exe --console` overrides for one run.
hide_console = true
